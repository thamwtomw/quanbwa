<body>
    <div id="summernote-editor-container">
        <!-- EDITOR -->
        <div id="summernote-editor" placeholder="paste TEXT | MARKDOWN | HTML để  CHỈNHSỬA tại Đây..."></div>

    <script>
        // <![CDATA[
        // TUZINH is a list of keywords for Summernote's hint feature, providing autocomplete suggestions as users type.
        const TUZINH = ['hehehe', 'hehe', 'hihi', 'huhu', 'hêhê', 'hê', 'hìhì', 'hùhù', 'huhu', 'ahihi'];
        // Initialize BBCode textarea
        const bbCodeTextArea = document.getElementById('bbcode-textarea');
        // Initialize Summernote
        $('#summernote-editor').summernote({
            inheritPlaceholder: true,
            spellCheck: false,
            hint: {
                words: TUZINH,
                // Matches 1 or more non-space characters
                match: /\b(\S{1,})$/,
                search: function (keyword, callback) {
                    var normalize = function (str) {
                        return str.toLowerCase()
                            .normalize("NFD")
                            .replace(/[\u0300-\u036f]/g, "") // Remove tones/diacritics
                            .replace(/đ/g, "d")             // Handle specific character
                            .replace(/\s+/g, "");           // Remove all spaces
                    };

                    var normalizedKeyword = normalize(keyword);

                    callback($.grep(this.words, function (item) {
                        // Normalize the list item (remove its spaces and accents) 
                        // and compare it to the keyword (which has no spaces)
                        return normalize(item).indexOf(normalizedKeyword) === 0;
                    }));
                }
            },
            toolbar: [
                ['custom', ['customDropdown', 'fontname', 'color']],
                ['insertLink', ['url', 'img', 'youtube', 'emoji']],
                ['insert', ['table', 'ul', 'ol', 'paragraph']],
                ['view', ['undo', 'redo', 'clear', 'codeview']],
                ['misc', ['copyB', 'replyB', 'clearB']]
            ],
            buttons: {
                customDropdown: customDropdownButton,
                url: urlButton,
                img: imgButton,
                youtube: videoButton,
                emoji: emojiButton,
                copyB: copyButton,
                replyB: replyButton,
                clearB: clearButton
            },
            fontNames: [
                'Arial', 'Arial Black', 'Comic Sans MS', 'Courier New',
                'Helvetica Neue', 'Helvetica', 'Impact', 'Lucida Grande',
                'Tahoma', 'Times New Roman', 'Verdana',
            ],
            disableDragAndDrop: true,
            callbacks: {
                onPaste: filterPastedToSummerNote,
                onChange: function (contents, $editable) {
                    bbCodeTextArea.value = html2bbcode(contents);
                },
                onInit: function () {
                    $(this).summernote('code', '');
                }
            }
        });


        // Buttons
        function customDropdownButton(context) {
            const ui = $.summernote.ui;

            const formatPanel = document.createElement('div');
            formatPanel.className = 'format-panel';
            formatPanel.style.display = 'none';

            const options = [
                { value: 'bold', label: '<b>Bold</b>' },
                { value: 'italic', label: '<i>Italic</i>' },
                { value: 'underline', label: '<u>Underline</u>' },
                { value: 'strikethrough', label: '<s>Strikethrough</s>' },
                { value: 'superscript', label: 'x&#178;' },
                { value: 'subscript', label: 'x&#8322;' },
                { value: 'code', label: '<a class="code">ＣＯＤＥ</a>' },
                //{ value: 'fcode', label: '[pre][/pre]' },
                { value: 'blockquote', label: 'Blockquote' }
                //{ value: 'h1', label: '<h1>H1</h1>' },
                //{ value: 'h2', label: '<h2>H2</h2>' },
                //{ value: 'h3', label: '<h3>H3</h3>' },
                //{ value: 'h4', label: '<h4>H4</h4>' },
                //{ value: 'h5', label: '<h5>H5</h5>' },
                //{ value: 'h6', label: '<h6>H6</h6>' }
            ];

            options.forEach(option => {
                const button = document.createElement('button');
                button.innerHTML = option.label;
                button.addEventListener('click', function () {
                    context.invoke('editor.focus');
                    if (['bold', 'italic', 'underline', 'strikethrough', 'superscript', 'subscript'].includes(option.value)) {
                        context.invoke('editor.' + option.value);
                    } else if ('code' === option.value) {
                        const blankCodeBlock = '<pre>// Mở <b>Code View</b> <button type="button" class="btn btn-default btn-sm"><i class="note-icon-code"></i></button> và PASTE vào giữa Thẻ &lt;pre&gt; &lt;/pre&gt;</pre>';
                        context.invoke('editor.pasteHTML', blankCodeBlock);
                    } else if ('fcode' === option.value) {
                        const blankCodeBlock = '<p>[pre] [/pre]</p>';
                        context.invoke('editor.pasteHTML', blankCodeBlock);
                    } else {
                        context.invoke('editor.formatBlock', option.value);
                    }
                    formatPanel.style.display = 'none';
                });
                formatPanel.appendChild(button);
            });

            const button = ui.button({
                contents: '<i class="note-icon-magic"/>',
                tooltip: 'Style',
                container: 'body',
                click: function () {
                    const panelPosition = $(this).offset();
                    formatPanel.style.top = `${panelPosition.top + 40}px`;
                    formatPanel.style.left = `${panelPosition.left}px`;

                    if (formatPanel.style.display === 'none') {
                        formatPanel.style.display = 'block';

                        const closePanelIfClickedOutside = function (e) {
                            const buttonElement = button.get(0);
                            if (!formatPanel.contains(e.target) && !buttonElement.contains(e.target)) {
                                formatPanel.style.display = 'none';
                                document.removeEventListener('click', closePanelIfClickedOutside);
                            }
                        };

                        document.addEventListener('click', closePanelIfClickedOutside);
                    } else {
                        formatPanel.style.display = 'none';
                    }
                }
            }).render();
            document.body.appendChild(formatPanel);
            return button;
        }

        function emojiButton(context) {
            const button = $.summernote.ui.button({
                contents: '<i class="note-icon-link"/><img src="https://cdn.jsdelivr.net/gh/thamwtomw/quanbwa/pepe/027.webp">',
                tooltip: 'Insert Pepe Emoji',
                container: 'body',
                click: () => emojiBtnHandler(button, context)
            }).render();
            return button;
        }


        function urlButton(context) {
            return $.summernote.ui.button({
                contents: '<i class="note-icon-link"/>',
                tooltip: 'Insert Link',
                container: 'body',
                click: () => urlButtonHandler(context)
            }).render();
        }

        function imgButton(context) {
            return $.summernote.ui.button({
                contents: '<i class="note-icon-picture"/>',
                tooltip: 'Insert Image (FIM)',
                container: 'body',
                click: () => imgButtonHandler(context)
            }).render();
        }

        function videoButton(context) {
            return $.summernote.ui.button({
                contents: '<i class="note-icon-video"/>',
                tooltip: 'Insert Youtube Video',
                container: 'body',
                click: () => videoButtonHandler(context)
            }).render();
        }

        function copyButton() {
            return $.summernote.ui.button({
                contents: 'CPY',
                tooltip: 'Copy Text to Clipboard',
                container: 'body',
                click: () => {
                    // copyToClipboard(bbCodeTextArea.value);
                    bbCodeTextArea.select();
                    document.execCommand('copy');
                    showWarningPopup('Text copied to Clipboard');
                }
            }).render();
        }

        function clearButton() {
            return $.summernote.ui.button({
                contents: 'CLR',
                tooltip: 'Clear All Contents',
                container: 'body',
                click: () => {
                    $('#summernote-editor').summernote('code', '');
                    bbCodeTextArea.value = '';
                    try {
                        window.parent.postMessage({ action: 'MEOCMT_SEND_TEXT_TO_AHTT', text: '' }, AHTT_BLOG_URL);
                    } catch (e) { }
                }
            }).render();
        }

        function replyButton() {
            return $.summernote.ui.button({
                contents: 'POST COMMENT',
                tooltip: 'Open Blogger Comment iFrame',
                container: 'body',
                click: () => sendBackToParent(bbCodeTextArea.value)
            }).render();
        }



        // Handlers for each button
        async function urlButtonHandler(context) {
            try {
                $('#summernote-editor').summernote('saveRange');
                ({ linkText, url } = await showUrlPopup('insertLink', 'link-url.com', getSelectingTextOfSummer()));
                $('#summernote-editor').summernote('restoreRange');
                if (url) insertToSummernote(context, 'link', linkText ? linkText : url, url);
            } catch (error) {
                console.error("Inserting Link:", error);
            }
        }

        async function imgButtonHandler(context) {
            try {
                $('#summernote-editor').summernote('saveRange');
                ({ linkText, url } = await showUrlPopup('insertImage', 'link.com/image.jpg'));
                $('#summernote-editor').summernote('restoreRange');
                if (url) insertToSummernote(context, 'image', '', url);
            } catch (error) {
                console.error("Inserting Image:", error);
            }
        }

        async function videoButtonHandler(context) {
            try {
                $('#summernote-editor').summernote('saveRange');
                ({ linkText, url } = await showUrlPopup('insertYoutube', 'youtube.com/watch?v=abCD'));
                $('#summernote-editor').summernote('restoreRange');
                if (url) insertToSummernote(context, 'youtube', '', url);
            } catch (error) {
                console.error("Inserting Video:", error);
            }
        }

        function emojiBtnHandler(button, context) {
            const smileyPanel = document.getElementById('smiley-panel');
            // Emoji image URLs
            const preLink = 'https://cdn.jsdelivr.net/gh/thamwtomw/quanbwa/pepe/';
            if (smileyPanel.innerHTML === '') {
                for (let id = 1; id <= 348; id++) {
                    const url = `${preLink}${String(id).padStart(3, '0')}.webp`;
                    const img = document.createElement('img');
                    img.src = url;
                    img.addEventListener('click', function () {
                        const imageTag = `<img class="fim" style="background-image:url(${url})" />`;
                        context.invoke('editor.insertNode', $(imageTag)[0]);
                    });
                    smileyPanel.appendChild(img);
                }
            }
            smileyPanel.style.display = 'flex';
            const closeSmileyPanel = function (e) {
                const buttonElement = button.get(0);
                if (!smileyPanel.contains(e.target) && !buttonElement.contains(e.target)) {
                    smileyPanel.style.display = 'none'; // Hide the panel
                    document.removeEventListener('click', closeSmileyPanel);
                }
            };
            document.addEventListener('click', closeSmileyPanel);
        }




        /**
         * Helpers
        */

        function filterPastedToSummerNote(e) {
            var clipboard = (e.originalEvent || e).clipboardData || window.clipboardData;
            var bufferHtml = clipboard.getData('text/html');
            var bufferText = clipboard.getData('text/plain');

            e.preventDefault();

            var contentToProcess = '';

            // If there's HTML, use it. If not, treat plain text as Markdown.
            if (bufferHtml) {
                contentToProcess = bufferHtml;
            } else if (bufferText) {
                // Assuming marked.parse() is available from the Marked.js library
                contentToProcess = marked?.parse(bufferText);
            }

            if (!contentToProcess) return;
            // Whitelist
            var allowedTags = ['B', 'I', 'U', 'IMG', 'STRIKE', 'SUP', 'SUB', 'SPAN', 'BLOCKQUOTE', 'PRE', 'TABLE', 'TBODY', 'TH', 'TR', 'TD', 'UL', 'OL', 'LI', 'A', 'P', 'HR', 'BR'];
            var allowedAttributes = ['style', 'href', 'src'];
            var allowedStyles = ['font-family', 'color', 'background-color', 'text-align', 'margin-left', 'margin-right'];

            var div = document.createElement('div');
            div.innerHTML = contentToProcess;

            var filter = function (node) {
                var nodes = node.querySelectorAll('*');

                // Define the transformation map
                var tagMap = {
                    'STRONG': 'B',
                    'EM': 'I',
                    'DEL': 'STRIKE'
                };

                for (var i = 0; i < nodes.length; i++) {
                    var el = nodes[i];
                    var tagName = el.tagName;

                    // 1. Transform H1-H6 to Bold with newlines
                    if (/^H[1-6]$/.test(tagName)) {
                        var bold = document.createElement('b');
                        while (el.firstChild) bold.appendChild(el.firstChild);

                        // Create four distinct instances
                        var br1 = document.createElement('br');
                        var br2 = document.createElement('br');
                        var br3 = document.createElement('br');
                        var br4 = document.createElement('br');

                        el.before(br1, br2); // Adds two newlines before
                        el.after(br3, br4);  // Adds two newlines after

                        el.parentNode.replaceChild(bold, el);
                        el = bold;
                    }
                    // 2. Transform specific tags based on the map
                    else if (tagMap[tagName]) {
                        var newTag = document.createElement(tagMap[tagName]);
                        while (el.firstChild) newTag.appendChild(el.firstChild);
                        el.parentNode.replaceChild(newTag, el);
                        el = newTag;
                    }

                    // Remove image without src
                    else if (tagName === 'IMG') {
                        var src = el.getAttribute('src');
                        if (!src || !src.startsWith('http')) {
                            el.parentNode.removeChild(el);
                            continue;
                        }
                    }

                    // 3. Remove tags not in whitelist
                    if (allowedTags.indexOf(el.tagName) === -1) {
                        while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
                        el.parentNode.removeChild(el);
                        continue;
                    }

                    // 4. Filter Attributes & 5. Filter Styles (Keep existing logic below)
                    for (var j = el.attributes.length - 1; j >= 0; j--) {
                        var attr = el.attributes[j];
                        if (allowedAttributes.indexOf(attr.name) === -1) {
                            el.removeAttribute(attr.name);
                        }
                    }
                    if (el.style.length > 0) {
                        var styles = el.style;
                        for (var k = styles.length - 1; k >= 0; k--) {
                            var styleName = styles[k];
                            if (allowedStyles.indexOf(styleName) === -1) {
                                el.style.removeProperty(styleName);
                            }
                        }
                    }
                }
            };

            filter(div);
            document.execCommand('insertHTML', false, div.innerHTML);
            //$('#summernote-editor').summernote('editor.pasteHTML', div.innerHTML);
        }


        function html2bbcode(html) {
            let bbcode = html;
            return bbcode
                .replace(/<p><br><\/p>/gi, '\n') // <p><br></p> → \n
                .replace(/<p>(.*?)<\/p>/gi, '$1\n') // <p>content</p> → content\n
                .replace(/<p style="">(.*?)<\/p>/gi, '$1\n') // <p style="">content</p> → content\n
                .replace(/<br\s*\/?>/gi, '\n') // <br> → \n
                .replace(/<u>(.*?)<\/u>/gi, '[u]$1[/u]') // <u> → [u]
                .replace(/<strike>(.*?)<\/strike>/gi, '[strike]$1[/strike]') // <strike> → [strike]
                .replace(/<sup>(.*?)<\/sup>/gi, '[sup]$1[/sup]') // <sup> → [sup]
                .replace(/<sub>(.*?)<\/sub>/gi, '[sub]$1[/sub]') // <sub> → [sub]
                .replace(/<font (.*?)>([\s\S]*?)<\/font>/gi, '[font $1]$2[/font]')
                .replace(/<span (.*?)>([\s\S]*?)<\/span>/gi, '[span $1]$2[/span]')
                .replace(/<p (.*?)>([\s\S]*?)<\/p>/gi, '[div $1]$2[/div]')
                .replace(/<blockquote.*?>/gi, '[blockquote]') // <blockquote> → [blockquote]
                .replace(/<\/blockquote>/gi, '[/blockquote]') // </blockquote> → [/blockquote]
                .replace(/<pre.*?>/gi, '[pre]') // <pre> → [pre]
                .replace(/<\/pre>/gi, '[/pre]') // </pre> → [/pre]
                .replace(/<table.*?>/gi, '[table class="table table-bordered"]') // <table> → [table]
                .replace(/<\/table>/gi, '[/table]') // </table> → [/table]
                .replace(/<tbody.*?>/gi, '[tbody]') // <table> → [table]
                .replace(/<\/tbody>/gi, '[/tbody]') // </table> → [/table]
                .replace(/<tr>/gi, '[tr]') // <tr> → [tr]
                .replace(/<\/tr>/gi, '[/tr]') // </tr> → [/tr]
                .replace(/<td>/gi, '[td]') // <td> → [td]
                .replace(/<\/td>/gi, '[/td]') // </td> → [/td]
                .replace(/<ul>/gi, '[ul]') // <ul> → [ul]
                .replace(/<\/ul>/gi, '[/ul]') // </ul> → [/ul]
                .replace(/<ol>/gi, '[ol]') // <ol> → [ol]
                .replace(/<\/ol>/gi, '[/ol]') // </ol> → [/ol]
                .replace(/<li>/gi, '[li]') // <li> → [li]
                .replace(/<\/li>/gi, '[/li]') // </li> → [/li]
                .replace(/<hr\s*\/?>/gi, '[hr ][/hr]') // <hr> → [hr]
                .replace(/<a href="(.*?)".*?>(.*?)<\/a>/gi, '[a href="$1"]$2[/a]') // Keep only href attribute
                //.replace(/<img src="(.*?)".*?\/?>/gi, '[img=$1]') // <img> → [img]
                .replace(/<img src="(.*?)".*?\/?>/gi, '[fim]$1[/fim]') // <img> → [fim]URL[/fim]
                .replace(/<img[^>]*class=["']fim["'][^>]*style=["'][^"']*background-image\s*:\s*url\(\s*(?:&quot;|['"])?([^)"']+)(?:&quot;|['"])?\s*\)[^"']*["'][^>]*>/gi, (_, url) => `[fim]${url.trim()}[/fim]`)
                .replace(/<iframe.*?src=".*?youtube\.com\/embed\/([a-zA-Z0-9_-]+).*?".*?<\/iframe>/gi, '[youtube=$1]')
                .replace(/<b>(.*?)<\/b>/gi, '[b]$1[/b]') // <b> → [b]
                .replace(/<i>(.*?)<\/i>/gi, '[i]$1[/i]') // <i> → [i]
                .replace(/<[^>]+>/g, '')                 // Remove all other tags
                .replace(/\[b\](.*?)\[\/b\]/g, '<b>$1</b>') // [b] → <b>
                .replace(/\[i\](.*?)\[\/i\]/g, '<i>$1</i>') // [i] → <i>
                //.replace(/d/gi, 'z') // d → z
                //.replace(/đ/gi, 'd') // đ → d
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>')
                .replace(/&quot;/gi, '"')
                .trim();
        }

        function decodeHtmlEntities(text) {
            const element = document.createElement('div');
            if (text) {
                element.innerHTML = text;
                return element.textContent || element.innerText || '';
            }
            return text;
        }

        function insertToSummernote(context, type, linkText, url) {

            switch (type) {
                case 'link':
                    context.invoke('editor.createLink', { text: linkText, url: url, newWindow: true });
                    break;
                case 'image':
                    context.invoke('editor.insertImage', url);
                    break;
                case 'youtube':
                    //const match = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
                    const match = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{11})/i);
                    const videoId = match ? match[1] : null;
                    if (videoId) {
                        const iframe = `<iframe width="560" height="315" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
                        context.invoke('editor.pasteHTML', iframe);
                    } else {
                        alert('Invalid YouTube URL');
                    }
                    break;
            }
        }

        function insertToEndOfSummernote(refHTML) {
            const editor = $('#summernote-editor');
            editor.summernote('focus');

            // Move the internal range to the end of the content
            const editable = editor.next('.note-editor').find('.note-editable');
            const node = editable[0];

            if (node) {
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(node);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }

            // Insert the HTML at the new cursor position
            editor.summernote('pasteHTML', refHTML);
        }


        function getSelectingTextOfSummer() {
            const editor = $('#summernote-editor');
            if (!editor.length || !editor.summernote) return '';

            try {
                const range = editor.summernote('createRange');
                return range ? range.toString() : '';
            } catch (e) {
                return '';
            }
        }

        let urlPopupTimer; // Store timer reference globally or in an outer scope
        let removeUrlPopup; // Store cleanup function reference
        function showUrlPopup(command, urlPlaceholder = 'http://link-url.com', textInputDefaultValue = 'Link Text') {

            if (removeUrlPopup) {
                document.removeEventListener('click', removeUrlPopup);
                clearTimeout(urlPopupTimer);
            }

            return new Promise((resolve, reject) => {
                const urlPopup = document.getElementById('url-popup');
                const enterBtn = document.getElementById('enter-btn');
                const cancelBtn = document.getElementById('cancel-btn');
                const textInput = document.getElementById('text-input');
                const urlInput = document.getElementById('url-input');

                urlPopup.style.display = 'flex';
                textInput.style.display = command === 'insertLink' ? 'block' : 'none';
                textInput.value = textInputDefaultValue;
                enterBtn.style.display = 'none';
                urlInput.placeholder = urlPlaceholder;
                urlInput.value = '';
                urlInput.focus();

                removeUrlPopup = () => {
                    urlPopup.style.display = 'none';
                    document.removeEventListener('click', removeUrlPopup);
                    reject('Cancel Insert URL');
                    removeUrlPopup = null;
                };


                urlPopupTimer = setTimeout(() => document.addEventListener('click', removeUrlPopup), 50);

                urlPopup.onclick = e => e.stopPropagation();

                urlInput.addEventListener('input', () => {
                    const value = urlInput.value.trim();
                    let isValid = false;
                    if (!value) return;

                    switch (command) {
                        case 'insertLink': isValid = isValidUrl(value); break;
                        case 'insertImage': isValid = isValidImageUrl(value); break;
                        case 'insertYoutube': isValid = isValidYoutubeUrl(value); break;
                    }

                    enterBtn.style.display = isValid ? 'block' : 'none';
                    urlInput.style.backgroundColor = isValid ? 'var(--bg-primary)' : '#dd7b7b';
                });

                enterBtn.onclick = () => {
                    urlPopup.style.display = 'none';
                    document.removeEventListener('click', removeUrlPopup);
                    resolve({ linkText: textInput.value.trim(), url: urlInput.value.trim() });
                };

                cancelBtn.onclick = removeUrlPopup;
            });
        }
        const convertYouTubeToEmbed = url =>
            url.replace(/watch\?v=/, 'embed/');

        function isValidUrl(url) {
            const pattern = /^(https?:\/\/)?([a-z0-9-]+(\.[a-z0-9-]+)+)(:[0-9]+)?(\/[^\s]*)?(\?[^\s]*)?(#[^\s]*)?$/i;
            return pattern.test(url);
        }
        function isValidYoutubeUrl(url) {
            const youtubePattern = /^(https?:\/\/)?(www\.|m\.)?(youtube\.com\/(watch\?v=|shorts\/)[\w-]+|youtu\.be\/[\w-]+)(\S*)?$/i;
            return isValidUrl(url) && youtubePattern.test(url);
        }
        function isValidImageUrl(url) {
            const imagePattern = /\.(jpg|jpeg|png|gif|avif|svg|webp)$/i;
            return isValidUrl(url) && imagePattern.test(url);
        }

        let warningPopupTimer;
        let clickDelayTimer; // New reference for the 50ms delay
        let removeWarningPopup;

        function showWarningPopup(popupText) {
            const warningPopup = document.getElementById('warning-popup');

            // 1. Reset everything
            if (removeWarningPopup) {
                removeWarningPopup();
            }
            clearTimeout(clickDelayTimer);

            warningPopup.innerHTML = popupText;
            warningPopup.style.display = 'block';

            // 2. Define cleanup
            removeWarningPopup = () => {
                warningPopup.style.display = 'none';
                document.removeEventListener('click', removeWarningPopup);
                clearTimeout(warningPopupTimer);
                clearTimeout(clickDelayTimer);
                removeWarningPopup = null;
            };

            // 3. Auto-hide after 2500ms
            warningPopupTimer = setTimeout(removeWarningPopup, 2500);

            // 4. Safe Click Listener
            clickDelayTimer = setTimeout(() => {
                document.addEventListener('click', removeWarningPopup);
            }, 50);
        }

        const AHTT_BLOG_URL = "https://an-hoang-trung-tuong-2014.blogspot.com";

        // GET MESSAGE FROM PARENT
        window.addEventListener('message', (e) => {
            // SECURITY: Always verify the origin of the sender
            if (e.origin !== AHTT_BLOG_URL) {
                return;
            }
            const data = e.data;
            if (data.action === 'AHTT_SEND_REF_TO_MEOCMT') {
                const decodedText = decodeURIComponent(data.text);
                insertToEndOfSummernote(decodedText);
            } else if (data.action === 'AHTT_GET_TEXT_FR_MEOCMT') {
                sendBackToParent(bbCodeTextArea.value);
            }
        }, false);

        // SEND MESSAGE TO PARENT
        function sendBackToParent(textContent = '') {
            try {
                const cleanText = encodeURIComponent(textContent);
                window.parent.postMessage(
                    { action: 'MEOCMT_SEND_TEXT_TO_AHTT', text: cleanText },

                // showWarningPopup(`${isPhone() ? '<b>KÉO-XUỐNGZƯỚI ĐỂ <a class="code">COPY</a></b>, xong' : '<b>COPIED TEXT...</b>'}
                // showWarningPopup(`<b>COPIED TEXT...</b><br><a class="code">Zán</a> <a class="code">Paste</a> <a class="code">Ctrl + V</a> vô <a class="code">Blogger Comment</a>, rồi<br><b class="publish">TRẢ LỜI</b> <b class="publish">ĐĂNG</b> <b class="publish">PUBLISH</b>`);
                showWarningPopup(`Chuyểnsang <a class="code">Blogger Comment</a> để<br><b class="publish">TRẢ LỜI</b> <b class="publish">ĐĂNG</b> <b class="publish">PUBLISH</b>`);
                //copyToClipboard(textContent);
                bbCodeTextArea.select();
                document.execCommand('copy');
            } catch (err) {
                console.error("Failed to send message:", err);
                showWarningPopup('ERROR!!!Press <button type="button" class="btn btn-default btn-sm">CPY</button> to COPY');
            }
        }

        //COPY
        async function copyToClipboard(text) {
            try {
                // Decode the text to handle %20, %3A, etc.
                const blob = new Blob([text], { type: 'text/plain' });
                await navigator.clipboard.write([
                    new ClipboardItem({ 'text/plain': blob })
                ]);
                //console.log('COPIED TEXT...');
            } catch (err) {
                console.error('Error when copying: ', err);
            }
        }

        function isPhone() {
            return /Mobi|Android|iPhone|iPad|iPod|Windows Phone|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||

        };
